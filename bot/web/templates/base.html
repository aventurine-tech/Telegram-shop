<!DOCTYPE html>
<html lang="{{ current_language() }}" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  {# Apply the saved (or the system) theme before the first paint, so a dark panel never flashes white. #}
  <script>
    (function () {
      var theme = 'light';
      try {
        theme = localStorage.getItem('shop-theme') ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/select2.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/flatpickr.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/main.css') }}">
  <style>
    /* Our own bits, themed with the UI kit's variables so they follow light / dark. */
    /* The bundled UI kit version ships no dark surface colours, so define them. */
    [data-bs-theme="dark"] {
      color-scheme: dark;
      --tblr-body-bg: #151f2c; --tblr-body-color: #dce1e7; --tblr-emphasis-color: #f8fafc;
      --tblr-bg-surface: #182433; --tblr-bg-surface-secondary: #1c2a3b; --tblr-bg-surface-tertiary: #151f2c;
      --tblr-bg-forms: #151f2c; --tblr-border-color: #2c3a4e; --tblr-border-color-translucent: rgba(255,255,255,.12);
      --tblr-secondary-color: #9aa8bb; --tblr-muted: #9aa8bb; --tblr-link-color: #6ea8e8;
      --tblr-shadow-card: none;
    }
    [data-bs-theme="dark"] body { background-color: var(--tblr-body-bg); color: var(--tblr-body-color); }
    [data-bs-theme="dark"] .card, [data-bs-theme="dark"] .dropdown-menu, [data-bs-theme="dark"] .modal-content,
    [data-bs-theme="dark"] .page-wrapper .table, [data-bs-theme="dark"] .table > :not(caption) > * > * {
      background-color: var(--tblr-bg-surface); color: var(--tblr-body-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .card-footer, [data-bs-theme="dark"] .card-header, [data-bs-theme="dark"] .table thead th {
      background-color: var(--tblr-bg-surface-secondary); color: var(--tblr-secondary-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .table-hover > tbody > tr:hover > * { background-color: var(--tblr-bg-surface-secondary); }
    [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select, [data-bs-theme="dark"] select,
    [data-bs-theme="dark"] input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=file]), [data-bs-theme="dark"] textarea {
      background-color: var(--tblr-bg-forms); color: var(--tblr-body-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .btn-light, [data-bs-theme="dark"] .btn:not([class*="btn-primary"]):not([class*="btn-danger"]):not([class*="btn-outline"]):not([class*="btn-secondary"]):not([class*="btn-success"]):not([class*="btn-blue"]):not([class*="btn-azure"]) {
      background-color: var(--tblr-bg-surface-secondary); color: var(--tblr-body-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .dropdown-item { color: var(--tblr-body-color); }
    [data-bs-theme="dark"] .dropdown-item:hover { background-color: var(--tblr-bg-surface-secondary); }
    [data-bs-theme="dark"] .form-fieldset { background-color: var(--tblr-bg-surface-secondary); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .page-link { background-color: var(--tblr-bg-surface); color: var(--tblr-body-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .page-item.active .page-link { background-color: var(--tblr-primary); color: #fff; }
    [data-bs-theme="dark"] .page-item.disabled .page-link { color: var(--tblr-secondary-color); }
    [data-bs-theme="dark"] .alert-danger { background-color: var(--tblr-danger-bg-subtle, #3b1f26); color: var(--tblr-danger-text, #f3b5b5); }
    [data-bs-theme="dark"] .alert-success { background-color: rgba(47,179,68,.15); color: #9fe0aa; }
    [data-bs-theme="dark"] .modal-footer, [data-bs-theme="dark"] .modal-header { border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .table-responsive, [data-bs-theme="dark"] .card-body { color: var(--tblr-body-color); }
    .shop-pill { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 4px; font-size: 12px;
      background: var(--tblr-bg-surface-secondary, #e2e8f0); color: var(--tblr-body-color); border: 1px solid var(--tblr-border-color); }
    .shop-pill-danger { background: var(--tblr-danger-bg-subtle, #fed7d7); color: var(--tblr-danger-text, #9b2c2c);
      border-color: var(--tblr-danger-border-subtle, #fed7d7); font-weight: 600; }
    .tg-bubble { background: #e7f0fa; color: #111; border-radius: 12px; max-width: 420px; overflow-wrap: anywhere; }
    [data-bs-theme="dark"] .tg-bubble { background: #2b5278; color: #f1f5f9; }
    [data-bs-theme="dark"] .tg-bubble a { color: #8ec5ff; }
    .theme-toggle { width: 100%; }
    /* Select2 and flatpickr ship light-only styles. */
    [data-bs-theme="dark"] .select2-container--default .select2-selection--single,
    [data-bs-theme="dark"] .select2-container--default .select2-selection--multiple,
    [data-bs-theme="dark"] .select2-dropdown,
    [data-bs-theme="dark"] .select2-search--dropdown .select2-search__field {
      background-color: var(--tblr-bg-forms, #1b2434); color: var(--tblr-body-color); border-color: var(--tblr-border-color); }
    [data-bs-theme="dark"] .select2-container--default .select2-selection--single .select2-selection__rendered { color: var(--tblr-body-color); }
    [data-bs-theme="dark"] .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: var(--tblr-primary); color: #fff; }
    [data-bs-theme="dark"] .select2-container--default .select2-results__option[aria-selected=true] { background-color: rgba(255,255,255,.08); }
    [data-bs-theme="dark"] .flatpickr-calendar { background: var(--tblr-bg-surface, #182433); color: var(--tblr-body-color); box-shadow: none; border: 1px solid var(--tblr-border-color); }
    [data-bs-theme="dark"] .flatpickr-day, [data-bs-theme="dark"] .flatpickr-months .flatpickr-month,
    [data-bs-theme="dark"] .flatpickr-current-month .flatpickr-monthDropdown-months, [data-bs-theme="dark"] span.flatpickr-weekday { color: var(--tblr-body-color); background: transparent; }
    [data-bs-theme="dark"] .flatpickr-months .flatpickr-prev-month svg, [data-bs-theme="dark"] .flatpickr-months .flatpickr-next-month svg { fill: var(--tblr-body-color); }
    [data-bs-theme="dark"] .flatpickr-day.selected { background: var(--tblr-primary); border-color: var(--tblr-primary); color: #fff; }
  </style>
  {% block head %}
  {% endblock %}
  <title>{{ admin.title }}</title>
</head>

<body>
  {% block body %}
  <main>
    {% block main %}
    {% endblock %}
  </main>
  {% endblock %}
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/jquery.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/tabler.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/popper.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/bootstrap.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/select2.full.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/flatpickr.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/main.js') }}"></script>
  <script>
    /* Light / dark switch: remembered in this browser; the page's theme attribute is set by the script in <head>. */
    (function () {
      function current() { return document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light'; }
      function paint() {
        var dark = current() === 'dark';
        document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
          b.querySelector('.theme-icon').className = 'theme-icon fa-solid ' + (dark ? 'fa-sun' : 'fa-moon');
          b.querySelector('.theme-label').textContent = dark ? b.getAttribute('data-label-light') : b.getAttribute('data-label-dark');
          b.setAttribute('aria-pressed', dark ? 'true' : 'false');
        });
      }
      document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
        b.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-bs-theme', next);
          try { localStorage.setItem('shop-theme', next); } catch (e) {}
          paint();
        });
      });
      paint();
    })();
  </script>
  {% block tail %}
  {% endblock %}
</body>

</html>
